version: '3.8'

services:
  pythonai-api:
    build:
      context: .
      target: runtime
    container_name: pythonai-api
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - pythonai-godmode:/app/python_brain_godmode
      - pythonai-checkpoints:/app/checkpoints
      - pythonai-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pythonai-webui:
    build:
      context: .
      target: runtime
    container_name: pythonai-webui
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - pythonai-godmode:/app/python_brain_godmode
      - pythonai-checkpoints:/app/checkpoints
      - pythonai-data:/app/data
    command: ["python", "-m", "streamlit", "run", "src/webui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pythonai-api:
        condition: service_healthy

volumes:
  pythonai-godmode:
  pythonai-checkpoints:
  pythonai-data:
