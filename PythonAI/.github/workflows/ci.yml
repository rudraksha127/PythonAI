name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all pytest tests (parallel)
        run: |
          python -m pytest tests/ -v --tb=short -n auto

      - name: Run E2E smoke test runner (pytest only)
        run: |
          python tests/run_smoke_rag.py --skip-rag --verbose

      - name: Run training smoke test (quick validation)
        run: |
          # Quick smoke run: uses small dataset and 2 steps via --test-mode
          python -m src.training.run --test-mode --max-steps 2 --max-examples 4

      - name: Run E2E smoke test runner (parallel)
        run: |
          python -m pytest tests/ -v --tb=short -n auto --reruns 2
