# ═══════════════════════════════════════════════
# PythonAI — Docker Dev Override
# ═══════════════════════════════════════════════
# Enables hot-reload, local volume mounts, debug ports
# and relaxed resource limits for development.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#   # or simply: docker compose up (auto-merges override)
# ═══════════════════════════════════════════════

version: '3.8'

services:
  pythonai-api:
    build:
      target: builder  # Use builder stage for live reload
    container_name: pythonai-api-dev
    volumes:
      - .:/app          # Mount source code for hot-reload
      - pythonai-godmode:/app/python_brain_godmode
      - pythonai-checkpoints:/app/checkpoints
      - pythonai-data:/app/data
    ports:
      - "8765:8765"
      - "5678:5678"     # Debug port (for remote debugger)
    environment:
      - PYTHONAI_LOG_LEVEL=DEBUG
      - PYTHONAI_DEV_MODE=1
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8765", "--reload"]
    healthcheck:
      disable: true  # Disable health check for dev (reload may cause flapping)
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

  pythonai-webui:
    container_name: pythonai-webui-dev
    volumes:
      - .:/app          # Mount source code
      - pythonai-godmode:/app/python_brain_godmode
      - pythonai-checkpoints:/app/checkpoints
      - pythonai-data:/app/data
    environment:
      - PYTHONAI_LOG_LEVEL=DEBUG
      - PYTHONAI_DEV_MODE=1
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    depends_on:
      - pythonai-api  # No health check dependency in dev mode
