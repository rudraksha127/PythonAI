version: '3.8'

services:
  pythonai-api:
    build: .
    container_name: pythonai-api
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./python_brain_godmode:/app/python_brain_godmode
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    restart: unless-stopped

  pythonai-webui:
    build: .
    container_name: pythonai-webui
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./python_brain_godmode:/app/python_brain_godmode
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    command: ["python", "-m", "streamlit", "run", "src/webui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    restart: unless-stopped
    depends_on:
      - pythonai-api
