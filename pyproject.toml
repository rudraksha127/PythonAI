[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forgeai-migrate"
version = "0.1.0"
description = "One-shot migration script to reorganise the ForgeAI workspace into a monorepo."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["forgeai-core/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

# ---------------------------------------------------------------------------
# Coverage (optional — uncomment when using pytest-cov)
# ---------------------------------------------------------------------------

# [tool.coverage.run]
# source = ["migrate"]

# ---------------------------------------------------------------------------
# Ruff (linting — matches existing workspace config)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
